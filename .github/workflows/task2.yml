name: Task2 Calculator CI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/task2.yml"
      - "Task2-MyCalc/**"
  pull_request:
    paths:
      - ".github/workflows/task2.yml"
      - "Task2-MyCalc/**"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2-MyCalc
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Android and run shared tests
        run: bash ./gradlew :app:assembleDebug :app:allTests --stacktrace

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2-MyCalc
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Desktop
        run: bash ./gradlew :app:desktopJar --stacktrace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task2-MyCalc
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Web
        run: bash ./gradlew :app:wasmJsBrowserDistribution --stacktrace

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Task2-MyCalc
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build iOS simulator framework
        run: bash ./gradlew :app:linkDebugFrameworkIosSimulatorArm64 --stacktrace
