name: Task1 Weather CI

on:
  push:
    paths:
      - "Task1-WeatherApplication/**"
  pull_request:
    paths:
      - "Task1-WeatherApplication/**"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Gradle cache
        uses: gradle/gradle-build-action@v3
      - name: Build Android + run unit tests
        run: ./gradlew :app:assembleDebug :app:allTests --stacktrace

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Gradle cache
        uses: gradle/gradle-build-action@v3
      - name: Build Desktop
        run: ./gradlew :app:desktopJar --stacktrace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Gradle cache
        uses: gradle/gradle-build-action@v3
      - name: Build Web (Wasm)
        run: ./gradlew :app:wasmJsBrowserDistribution --stacktrace

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Gradle cache
        uses: gradle/gradle-build-action@v3
      - name: Build iOS (simulator framework)
        run: ./gradlew :app:linkReleaseFrameworkIosSimulatorArm64 --stacktrace
