name: Task1 Weather CI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/task1.yml"
      - "Task1-WeatherApplication/**"
  pull_request:
    paths:
      - ".github/workflows/task1.yml"
      - "Task1-WeatherApplication/**"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Android and run Android unit tests
        run: bash ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Desktop and run desktop tests
        run: bash ./gradlew :app:desktopJar :app:desktopTest --stacktrace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build Web
        run: bash ./gradlew :app:wasmJsBrowserDistribution --stacktrace

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Task1-WeatherApplication
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build iOS simulator framework
        run: bash ./gradlew :app:linkIosSimulatorArm64 --stacktrace
